<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きょう、どんなヘアにする？ | @mh_hairarrange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Yomogi&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --cream-deep: #FBEDD9;
    --peach: #FFD4C4;
    --peach-deep: #FFB8A0;
    --pink: #FFC8D4;
    --pink-deep: #F5A6B8;
    --lavender: #E5D4F0;
    --mint: #C8E6D5;
    --yellow: #FFE8A8;
    --text: #5C4A3F;
    --text-soft: #9B8275;
    --accent: #E8795A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
    font-weight: 500;
    color: var(--text);
    background: var(--cream);
    min-height: 100vh;
    line-height: 1.7;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 200, 212, 0.35) 0%, transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(229, 212, 240, 0.35) 0%, transparent 30%),
      radial-gradient(circle at 75% 80%, rgba(255, 212, 196, 0.35) 0%, transparent 35%),
      radial-gradient(circle at 10% 90%, rgba(200, 230, 213, 0.3) 0%, transparent 30%);
    z-index: -1;
    pointer-events: none;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px 40px;
    position: relative;
  }

  /* Header */
  header { padding: 28px 0 18px; text-align: center; }
  .ribbon {
    font-size: 26px;
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .ribbon span {
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .ribbon span:nth-child(1) { animation-delay: 0s; }
  .ribbon span:nth-child(2) { animation-delay: 0.15s; }
  .ribbon span:nth-child(3) { animation-delay: 0.3s; }
  .ribbon span:nth-child(4) { animation-delay: 0.45s; }
  .ribbon span:nth-child(5) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-6px) rotate(5deg); }
  }
  .english-title {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 600;
    color: var(--peach-deep);
    letter-spacing: 0.03em;
    margin-bottom: 2px;
  }
  .title {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.35;
  }
  .title .accent {
    color: var(--accent);
    position: relative;
    display: inline-block;
  }
  .title .accent::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 8px;
    background: var(--yellow);
    z-index: -1;
    border-radius: 10px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-soft);
    margin-top: 10px;
  }
  .subtitle a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
  }

  /* STEP label */
  .step {
    display: inline-block;
    background: white;
    border: 2px dashed var(--peach-deep);
    color: var(--peach-deep);
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 600;
    padding: 3px 16px;
    border-radius: 999px;
    margin: 18px 0 14px;
    letter-spacing: 0.08em;
  }

  /* Back button */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 16px 8px 12px;
    border-radius: 999px;
    margin: 16px 0 6px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(245, 166, 184, 0.25);
    transition: transform .15s ease;
  }
  .back-btn:hover { transform: translateX(-2px); }
  .back-btn::before { content: '←'; font-weight: 700; }

  /* Screens */
  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Category grid */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 8px;
  }
  .cat-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(255, 200, 212, 0.4);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: column;
    min-height: 180px;
  }
  .cat-card:hover, .cat-card:active {
    transform: translateY(-4px);
    box-shadow: 0 8px 0 rgba(255, 200, 212, 0.5);
  }
  .cat-card .top {
    flex: 0 0 60%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .cat-card .top::after {
    content: '';
    position: absolute;
    top: 10px;
    right: 12px;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
  }
  .cat-card .icon {
    font-size: 40px;
    filter: drop-shadow(0 2px 0 rgba(92, 74, 63, 0.08));
  }
  .cat-card .bottom {
    padding: 10px 12px 14px;
    text-align: center;
  }
  .cat-card .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .cat-card .count {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  /* Per-category gradients */
  .cat-card[data-cat="三つ編み"]  .top { background: linear-gradient(135deg, #FFE6D0 0%, #FFD4C4 100%); }
  .cat-card[data-cat="くるりんぱ"]  .top { background: linear-gradient(135deg, #FFE0EC 0%, #FFC8D4 100%); }
  .cat-card[data-cat="ポニーテール"]  .top { background: linear-gradient(135deg, #EEE0F7 0%, #E5D4F0 100%); }
  .cat-card[data-cat="ツイン"]  .top { background: linear-gradient(135deg, #DCEFDF 0%, #C8E6D5 100%); }
  .cat-card[data-cat="ローポニー"]  .top { background: linear-gradient(135deg, #FFF3C8 0%, #FFE8A8 100%); }
  .cat-card[data-cat="ハーフアップ"]  .top { background: linear-gradient(135deg, #FFD0DC 0%, #F5A6B8 100%); }
  .cat-card[data-cat="編み下ろし"]  .top { background: linear-gradient(135deg, #E8DDF5 0%, #C9B6E8 100%); }
  .cat-card[data-cat="その他"]  .top { background: linear-gradient(135deg, #D4F0E0 0%, #A8DDC2 100%); }
  .cat-card[data-cat="イベント"]  .top { background: linear-gradient(135deg, #FFE0D5 0%, #FFB8A0 100%); }
  .cat-card[data-cat="かんたん5分"]  .top { background: linear-gradient(135deg, #DCF0FA 0%, #B8DDED 100%); }

  /* Category header on screen 2 */
  .cat-header {
    text-align: center;
    padding: 8px 0 18px;
  }
  .cat-header .en {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--peach-deep);
  }
  .cat-header h2 {
    font-size: 22px;
    font-weight: 900;
    margin-top: 2px;
  }
  .cat-header h2 .cat-name {
    color: var(--accent);
    position: relative;
    display: inline-block;
  }
  .cat-header h2 .cat-name::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 7px;
    background: var(--yellow);
    z-index: -1;
    border-radius: 10px;
  }

  /* Arrange grid (screen 2) */
  .arr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .arr-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(255, 200, 212, 0.35);
    transition: transform .15s ease;
  }
  .arr-card:hover, .arr-card:active { transform: translateY(-3px); }
  .arr-thumb {
    position: relative;
    aspect-ratio: 1/1;
    overflow: hidden;
    background: var(--cream-deep);
  }
  .arr-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .arr-thumb::after {
    content: '';
    position: absolute;
    top: 8px;
    right: 8px;
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
  }
  .arr-card .name {
    padding: 10px 12px 14px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
  }

  /* Detail (screen 3) */
  .detail-hero {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    margin-top: 4px;
    aspect-ratio: 1/1;
    box-shadow: 0 4px 0 rgba(255, 200, 212, 0.4);
  }
  .detail-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .detail-badge {
    display: inline-block;
    background: var(--pink-deep);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    margin-top: 18px;
    letter-spacing: 0.06em;
  }
  .detail-name {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.4;
    margin-top: 10px;
  }
  .detail-desc {
    font-size: 14px;
    color: var(--text-soft);
    margin-top: 8px;
    line-height: 1.75;
  }
  .points-wrap {
    background: white;
    border-radius: 24px;
    padding: 20px 22px;
    margin-top: 22px;
    box-shadow: 0 3px 0 rgba(255, 200, 212, 0.35);
  }
  .points-wrap .title-line {
    font-size: 15px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  .points-wrap ul { list-style: none; }
  .points-wrap li {
    font-size: 14px;
    line-height: 1.75;
    padding: 6px 0 6px 28px;
    position: relative;
  }
  .points-wrap li::before {
    content: '🎀';
    position: absolute;
    left: 0;
    top: 6px;
  }
  .points-empty {
    font-size: 13px;
    color: var(--text-soft);
  }

  .insta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 22px;
    padding: 18px 20px;
    background: linear-gradient(135deg, #FCB69F 0%, #F5A6B8 50%, #E5D4F0 100%);
    color: white;
    font-family: inherit;
    font-weight: 900;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 0 rgba(245, 166, 184, 0.5);
    letter-spacing: 0.04em;
  }
  .insta-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
    transform: rotate(45deg);
    animation: shine 3s infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0% { transform: translate(-60%, -60%) rotate(45deg); }
    100% { transform: translate(60%, 60%) rotate(45deg); }
  }
  .insta-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 28px;
    font-family: 'Caveat', cursive;
    font-size: 14px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-soft);
    font-size: 14px;
  }

  /* Instagram in-app browser warning */
  .ig-warning {
    background: linear-gradient(135deg, #FFE0D5 0%, #FFD4C4 100%);
    border-radius: 16px;
    padding: 14px 38px 14px 16px;
    margin: 14px 0 4px;
    position: relative;
    font-size: 12px;
    line-height: 1.65;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(232, 121, 90, 0.18);
  }
  .ig-warning strong {
    color: var(--accent);
    font-weight: 900;
  }
  .ig-warning-close {
    position: absolute;
    top: 6px;
    right: 8px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--text-soft);
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    font-family: inherit;
  }
  .ig-warning-close:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <!-- Instagram in-app browser warning -->
  <div class="ig-warning" id="igWarning" hidden>
    📱 Instagramアプリ内では動画ページがうまく開かないことがあります。<br>
    画面右上「⋯」→「<strong>外部ブラウザで開く</strong>」を選ぶと、Safariなどで快適に見られます
    <button class="ig-warning-close" id="igWarningClose" aria-label="閉じる">×</button>
  </div>

  <!-- Screen 1: Category -->
  <section class="screen active" id="screen1">
    <header>
      <div class="ribbon" aria-hidden="true">
        <span>🎀</span><span>✿</span><span>🌸</span><span>✿</span><span>🎀</span>
      </div>
      <div class="english-title">kids hair arrange</div>
      <h1 class="title">きょう、どんな<span class="accent">ヘア</span>にする？</h1>
      <p class="subtitle"><a href="https://www.instagram.com/mh_hairarrange" target="_blank" rel="noopener">@mh_hairarrange</a> のキッズアレンジ集</p>
      <div class="step">STEP 1 / choose</div>
    </header>
    <div class="cat-grid" id="catGrid"></div>
    <p class="footer-note">made with ♡</p>
  </section>

  <!-- Screen 2: List -->
  <section class="screen" id="screen2">
    <button class="back-btn" data-back-to="1">カテゴリに戻る</button>
    <div class="step">STEP 2 / browse</div>
    <div class="cat-header">
      <div class="en" id="s2En"></div>
      <h2><span class="cat-name" id="s2Cat"></span> のアレンジ</h2>
    </div>
    <div class="arr-grid" id="arrGrid"></div>
  </section>

  <!-- Screen 3: Detail -->
  <section class="screen" id="screen3">
    <button class="back-btn" data-back-to="2">アレンジ一覧に戻る</button>
    <div class="step">STEP 3 / enjoy</div>
    <div class="detail-hero"><img id="dImg" alt=""></div>
    <span class="detail-badge" id="dBadge"></span>
    <h2 class="detail-name" id="dName"></h2>
    <p class="detail-desc" id="dDesc"></p>
    <div class="points-wrap">
      <div class="title-line">✿ ポイント</div>
      <ul id="dPoints"></ul>
    </div>
    <a class="insta-btn" id="dLink" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      Instagramで動画を見る
    </a>
  </section>

  <div class="loading" id="loading">読み込み中…</div>
</div>

<script>
const CATEGORIES = [
  { key: "三つ編み",    icon: "🌾", en: "mitsuami"    },
  { key: "くるりんぱ",  icon: "🍥", en: "kururinpa"   },
  { key: "ポニーテール", icon: "🦄", en: "ponytail"    },
  { key: "ツイン",      icon: "👯", en: "twin"        },
  { key: "ローポニー",   icon: "🌙", en: "low ponytail"},
  { key: "ハーフアップ", icon: "🌷", en: "half up"     },
  { key: "編み下ろし",  icon: "🌿", en: "amioroshi"   },
  { key: "その他",      icon: "✨", en: "others"      },
  { key: "イベント",     icon: "🎀", en: "event"       },
  { key: "かんたん5分",  icon: "⏰", en: "5 min"       },
];

let allReels = [];
let state = { screen: 1, category: null };

async function boot() {
  try {
    const res = await fetch("reels.json");
    allReels = await res.json();
  } catch (e) {
    document.getElementById("loading").textContent = "読み込みに失敗しました…";
    return;
  }
  document.getElementById("loading").remove();
  renderCategories();
  bindBackButtons();
  setupIGWarning();
  handleHash();
  window.addEventListener("hashchange", handleHash);
}

function setupIGWarning() {
  const isIGBrowser = /Instagram/i.test(navigator.userAgent);
  const dismissed = sessionStorage.getItem("igWarningDismissed") === "1";
  const el = document.getElementById("igWarning");
  if (!el) return;
  if (isIGBrowser && !dismissed) el.hidden = false;
  document.getElementById("igWarningClose").addEventListener("click", () => {
    el.hidden = true;
    try { sessionStorage.setItem("igWarningDismissed", "1"); } catch (e) {}
  });
}

function renderCategories() {
  const grid = document.getElementById("catGrid");
  grid.innerHTML = "";
  for (const cat of CATEGORIES) {
    const count = allReels.filter(r => r.category === cat.key).length;
    if (count === 0) continue;
    const div = document.createElement("div");
    div.className = "cat-card";
    div.dataset.cat = cat.key;
    div.innerHTML = `
      <div class="top"><span class="icon">${cat.icon}</span></div>
      <div class="bottom">
        <div class="name">${cat.key}</div>
        <div class="count">${count} styles</div>
      </div>`;
    div.addEventListener("click", () => { location.hash = `#/cat/${encodeURIComponent(cat.key)}`; });
    grid.appendChild(div);
  }
}

function renderList(catKey) {
  const meta = CATEGORIES.find(c => c.key === catKey);
  if (!meta) { location.hash = ""; return; }
  document.getElementById("s2En").textContent = meta.en;
  document.getElementById("s2Cat").textContent = meta.key;
  const items = allReels.filter(r => r.category === catKey);
  const grid = document.getElementById("arrGrid");
  grid.innerHTML = "";
  for (const r of items) {
    const card = document.createElement("div");
    card.className = "arr-card";
    card.innerHTML = `
      <div class="arr-thumb"><img src="${r.thumbnail}" alt="" loading="lazy"></div>
      <div class="name">${escapeHtml(r.name)}</div>`;
    card.addEventListener("click", () => {
      const idx = allReels.indexOf(r);
      location.hash = `#/detail/${encodeURIComponent(catKey)}/${idx}`;
    });
    grid.appendChild(card);
  }
}

function renderDetail(catKey, idx) {
  const r = allReels[idx];
  if (!r || r.category !== catKey) { location.hash = `#/cat/${encodeURIComponent(catKey)}`; return; }
  document.getElementById("dImg").src = r.thumbnail;
  document.getElementById("dImg").alt = r.name;
  document.getElementById("dBadge").textContent = catKey;
  document.getElementById("dName").textContent = r.name;

  const { desc, points } = parseCaption(r.caption);
  document.getElementById("dDesc").textContent = desc;
  const ul = document.getElementById("dPoints");
  ul.innerHTML = "";
  if (points.length === 0) {
    const li = document.createElement("li");
    li.textContent = "くわしくはInstagramの動画でチェック♡";
    ul.appendChild(li);
  } else {
    for (const p of points) {
      const li = document.createElement("li");
      li.textContent = p;
      ul.appendChild(li);
    }
  }
  document.getElementById("dLink").href = r.url;
}

/**
 * Extract: short description (1-2 sentences) + bullet-like points.
 * Rules:
 *  - strip Bio-repeat block starting with the long ∞*:;;; separator
 *  - strip header lines with @mh_hairarrange or leading ←
 *  - description = first 1-2 non-empty lines after that
 *  - points = lines starting with ・ | ✅ | ✔ | ◎ | ✿ | • | -  (3-5 items)
 */
function parseCaption(raw) {
  if (!raw) return { desc: "", points: [] };
  let text = raw;
  const sepIdx = text.indexOf("∞*:");
  if (sepIdx >= 0) text = text.slice(0, sepIdx);

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const bulletRe = /^[・✅✔◎✿•\-▶►※]\s*/;

  // strip header lines
  const body = [];
  let sawHeader = false;
  for (const l of lines) {
    if (!sawHeader && (l.includes("@mh_hairarrange") || l.startsWith("←") || l.startsWith("@mh_hairarrange"))) {
      sawHeader = true;
      continue;
    }
    body.push(l);
  }

  // description: first 1-2 non-bullet lines
  const descLines = [];
  for (const l of body) {
    if (bulletRe.test(l)) break;
    if (descLines.length >= 2) break;
    descLines.push(l);
  }
  let desc = descLines.join(" ").replace(/\s+/g, " ").trim();
  if (desc.length > 90) desc = desc.slice(0, 88) + "…";

  // points
  const points = [];
  for (const l of body) {
    if (bulletRe.test(l)) {
      const cleaned = l.replace(bulletRe, "").trim();
      if (cleaned && cleaned.length <= 60) points.push(cleaned);
      if (points.length >= 5) break;
    }
  }

  return { desc, points };
}

function showScreen(n) {
  state.screen = n;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen" + n).classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function bindBackButtons() {
  document.querySelectorAll(".back-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const to = btn.dataset.backTo;
      if (to === "1") location.hash = "";
      else if (to === "2" && state.category) location.hash = `#/cat/${encodeURIComponent(state.category)}`;
    });
  });
}

function handleHash() {
  const h = location.hash.replace(/^#/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts.length === 0) {
    state.category = null;
    showScreen(1);
  } else if (parts[0] === "cat" && parts[1]) {
    const cat = decodeURIComponent(parts[1]);
    state.category = cat;
    renderList(cat);
    showScreen(2);
  } else if (parts[0] === "detail" && parts[1] && parts[2] !== undefined) {
    const cat = decodeURIComponent(parts[1]);
    const idx = parseInt(parts[2], 10);
    state.category = cat;
    renderDetail(cat, idx);
    showScreen(3);
  } else {
    showScreen(1);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

boot();
</script>
